<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert System - Certainty Factor AaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>
        const API_BASE_URL = 'http://localhost:7000/api';
        
        // State Management
        const state = {
            user: null,
            token: localStorage.getItem('authToken') || null,
            currentPage: 'login',
            expertSystems: [],
            currentSystem: null,
            diseases: [],
            symptoms: [],
            rules: [],
            confidenceScales: [],
            consultations: []
        };

        // API Helper
        const api = {
            async request(endpoint, options = {}) {
                const config = {
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        ...(state.token && { 'Authorization': `Bearer ${state.token}` })
                    },
                    ...options
                };

                try {
                    const response = await fetch(`${API_BASE_URL}${endpoint}`, config);
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.message || 'Terjadi kesalahan');
                    }
                    
                    return data;
                } catch (error) {
                    showNotification(error.message, 'error');
                    throw error;
                }
            },

            async login(email, password) {
                const data = await this.request('/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });
                state.token = data.data.token;
                state.user = data.data.user;
                localStorage.setItem('authToken', state.token);
                return data;
            },

            async register(name, email, password, password_confirmation, role) {
                const data = await this.request('/register', {
                    method: 'POST',
                    body: JSON.stringify({ name, email, password, password_confirmation, role })
                });
                return data;
            },

            async logout() {
                await this.request('/logout', { method: 'POST' });
                state.token = null;
                state.user = null;
                localStorage.removeItem('authToken');
            },

            async getMe() {
                const data = await this.request('/me');
                state.user = data.data;
                return data;
            },

            async getExpertSystems() {
                const data = await this.request('/expert-systems');
                state.expertSystems = data.data;
                return data;
            },

            async createExpertSystem(formData) {
                return await this.request('/expert-systems', {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });
            },

            async updateExpertSystem(id, formData) {
                return await this.request(`/expert-systems/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify(formData)
                });
            },

            async deleteExpertSystem(id) {
                return await this.request(`/expert-systems/${id}`, {
                    method: 'DELETE'
                });
            },

            async getDiseases(systemId) {
                const data = await this.request(`/expert-systems/${systemId}/diseases`);
                state.diseases = data.data;
                return data;
            },

            async createDisease(systemId, formData) {
                return await this.request(`/expert-systems/${systemId}/diseases`, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });
            },

            async updateDisease(systemId, id, formData) {
                return await this.request(`/expert-systems/${systemId}/diseases/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify(formData)
                });
            },

            async deleteDisease(systemId, id) {
                return await this.request(`/expert-systems/${systemId}/diseases/${id}`, {
                    method: 'DELETE'
                });
            },

            async getSymptoms(systemId) {
                const data = await this.request(`/expert-systems/${systemId}/symptoms`);
                state.symptoms = data.data;
                return data;
            },

            async createSymptom(systemId, formData) {
                return await this.request(`/expert-systems/${systemId}/symptoms`, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });
            },

            async updateSymptom(systemId, id, formData) {
                return await this.request(`/expert-systems/${systemId}/symptoms/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify(formData)
                });
            },

            async deleteSymptom(systemId, id) {
                return await this.request(`/expert-systems/${systemId}/symptoms/${id}`, {
                    method: 'DELETE'
                });
            },

            async getRules(systemId) {
                const data = await this.request(`/expert-systems/${systemId}/rules`);
                state.rules = data.data;
                return data;
            },

            async createRule(systemId, formData) {
                return await this.request(`/expert-systems/${systemId}/rules`, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });
            },

            async deleteRule(systemId, id) {
                return await this.request(`/expert-systems/${systemId}/rules/${id}`, {
                    method: 'DELETE'
                });
            },

            async getConfidenceScales(systemId) {
                const data = await this.request(`/expert-systems/${systemId}/confidence-scales`);
                state.confidenceScales = data.data;
                return data;
            },

            async bulkUpsertConfidenceScales(systemId, scales) {
                return await this.request(`/expert-systems/${systemId}/confidence-scales/bulk`, {
                    method: 'POST',
                    body: JSON.stringify({ scales })
                });
            },

            async diagnose(systemId, symptoms) {
                return await this.request(`/expert-systems/${systemId}/diagnose`, {
                    method: 'POST',
                    body: JSON.stringify({ symptoms })
                });
            },

            async getConsultations() {
                const data = await this.request('/consultations');
                state.consultations = data.data;
                return data;
            }
        };

        // Utility Functions
        function showNotification(message, type = 'info') {
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };

            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        function showModal(title, content, onConfirm) {
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 fade-in">
                    <h3 class="text-xl font-bold mb-4">${title}</h3>
                    <div class="mb-6">${content}</div>
                    <div class="flex justify-end gap-2">
                        <button onclick="this.closest('.modal').remove()" 
                                class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">
                            Batal
                        </button>
                        <button onclick="this.closest('.modal').remove(); (${onConfirm})()" 
                                class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
                            Hapus
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // Pages
        const pages = {
            login: () => `

                            <p class="text-gray-600">Sistem Pakar Certainty Factor - AaaS</p>
                        </div>

                        <div class="mb-6">
                            <div class="flex border-b">
                                <button onclick="switchAuthTab('login')" 
                                        id="loginTab"
                                        class="flex-1 py-3 font-semibold border-b-2 border-purple-600 text-purple-600">
                                    Login
                                </button>
                                <button onclick="switchAuthTab('register')" 
                                        id="registerTab"
                                        class="flex-1 py-3 font-semibold text-gray-500">
                                    Register
                                </button>
                            </div>
                        </div>

                        <div id="loginForm">
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                                    <input type="email" name="email" required
                                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent"
                                           placeholder="email@example.com">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                    <input type="password" name="password" required
                                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent"
                                           placeholder="••••••••">
                                </div>
                                <button type="submit"
                                        class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 transition">
                                    Masuk
                                </button>
                            </form>
                        </div>

                        <div id="registerForm" style="display: none;">
                            <form onsubmit="handleRegister(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Nama</label>
                                    <input type="text" name="name" required
                                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent"
                                           placeholder="Nama lengkap">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                                    <input type="email" name="email" required
                                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent"
                                           placeholder="email@example.com">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                    <input type="password" name="password" required minlength="8"
                                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent"
                                           placeholder="Min. 8 karakter">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Konfirmasi Password</label>
                                    <input type="password" name="password_confirmation" required minlength="8"
                                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent"
                                           placeholder="Ulangi password">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                                    <select name="role" required
                                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent">
                                        <option value="">-- Pilih Role --</option>
                                        <option value="pakar">Pakar (Expert)</option>
                                        <option value="user">User (Pengguna)</option>
                                    </select>
                                </div>
                                <button type="submit"
                                        class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 transition">
                                    Daftar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `,

            pakarDashboard: () => `
                <div class="min-h-screen bg-gray-50">
                    <!-- Navbar -->
                    <nav class="bg-white shadow-sm">

                                <div class="flex items-center gap-4">
                                    <h1 class="text-2xl font-bold text-gray-800">Dashboard Pakar</h1>
                                </div>
                                <div class="flex items-center gap-4">
                                    <span class="text-gray-600">👤 ${state.user.name}</span>
                                    <button onclick="handleLogout()" 
                                            class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <!-- Main Content -->
                    <div class="container mx-auto px-4 py-8">
                        <div class="mb-6 flex justify-between items-center">
                            <h2 class="text-2xl font-bold text-gray-800">Sistem Pakar Saya</h2>
                            <button onclick="showCreateSystemModal()" 
                                    class="px-6 py-3 gradient-bg text-white rounded-lg hover:opacity-90">
                                Buat Sistem Pakar Baru
                            </button>
                        </div>

                        <div id="systemsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div class="text-center py-12 col-span-full">
                                <div class="loading mx-auto mb-4"></div>
                                <p class="text-gray-500">Memuat data...</p>
                            </div>
                        </div>
                    </div>
                </div>
            `,

            userDashboard: () => `
                <div class="min-h-screen bg-gray-50">
                    <!-- Navbar -->
                    <nav class="bg-white shadow-sm">
                        <div class="container mx-auto px-4 py-4">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center gap-4">
                                    <h1 class="text-2xl font-bold text-gray-800">Dashboard User</h1>
                                </div>
                                <div class="flex items-center gap-4">
                                    <button onclick="navigateTo('userConsultations')" 
                                            class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600">
                                        Riwayat Konsultasi
                                    </button>
                                    <span class="text-gray-600">👤 ${state.user.name}</span>
                                    <button onclick="handleLogout()" 
                                            class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <!-- Main Content -->
                    <div class="container mx-auto px-4 py-8">
                        <div class="mb-6">
                            <h2 class="text-2xl font-bold text-gray-800">Sistem Pakar Tersedia</h2>
                            <p class="text-gray-600">Pilih sistem pakar untuk melakukan konsultasi</p>
                        </div>

                        <div id="systemsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div class="text-center py-12 col-span-full">
                                <div class="loading mx-auto mb-4"></div>
                                <p class="text-gray-500">Memuat data...</p>
                            </div>
                        </div>
                    </div>
                </div>
            `,

            systemDetail: (system) => `

                                <button onclick="navigateTo('pakarDashboard')"

                                </button>
                                <div class="flex items-center gap-4">
                                    <span class="text-gray-600">👤 ${state.user.name}</span>
                                    <button onclick="handleLogout()"

                    </nav>

                    <!-- Main Content -->
                    <div class="container mx-auto px-4 py-8">

                        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">

            consultation: (system) => `

            consultations: () => `
                <div class="min-h-screen bg-gray-50">

                        <div class="container mx-auto px-4 py-4">

                showNotification('Login berhasil!', 'success');
                
                if (state.user.role === 'pakar') {
                    navigateTo('pakarDashboard');
                } else {
                    navigateTo('userDashboard');
                }
            } catch (error) {
                console.error('Login error:', error);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const password = formData.get('password');
            const confirmation = formData.get('password_confirmation');
            
            if (password !== confirmation) {
                showNotification('Password tidak cocok!', 'error');
                return;
            }

            try {
                await api.register(
                    formData.get('name'),
                    formData.get('email'),
                    password,
                    confirmation,
                    formData.get('role')
                );
                showNotification('Registrasi berhasil! Silakan login.', 'success');
                switchAuthTab('login');
            } catch (error) {
                console.error('Register error:', error);
            }
        }

                showNotification('Logout berhasil', 'success');

            document.getElementById('loginTab').classList.add('text-gray-500');

            if (tab === 'login') {

                document.getElementById('loginTab').classList.remove('text-gray-500');
                document.getElementById('loginForm').style.display = 'block';

                document.getElementById('registerTab').classList.add('border-b-2', 'border-purple-600', 'text-purple-600');

        async function handleDiagnose(e) {
            e.preventDefault();
            const form = e.target;
            const symptoms = {};

            state.symptoms.forEach(symptom => {
                const checkbox = document.getElementById(`symptom_${symptom.id}`);
                if (checkbox && checkbox.checked) {
                    const select = form.querySelector(`select[name="confidence_${symptom.id}"]`);
                    // Konversi ID ke string dan value ke float
                    symptoms[symptom.id.toString()] = parseFloat(select.value);
                }
            });

            if (Object.keys(symptoms).length === 0) {
                showNotification('Pilih minimal satu gejala!', 'error');
                return;
            }

            console.log('Symptoms yang dikirim:', symptoms); // Debug: lihat data yang dikirim
            console.log('System ID:', state.currentSystem.id); // Debug: lihat system ID

            try {
                const result = await api.diagnose(state.currentSystem.id, symptoms);
                console.log('Diagnose result:', result); // Debug: lihat struktur response
                displayDiagnoseResult(result.data || result);
                showNotification('Diagnosa berhasil!', 'success');
            } catch (error) {
                console.error('Diagnose error:', error);
            }
        }

        function displayDiagnoseResult(result) {
            const resultSection = document.getElementById('resultSection');
            const resultContent = document.getElementById('resultContent');
            
            console.log('Display result:', result); // Debug: lihat data yang diterima
            
            resultSection.style.display = 'block';
            
            // Handle berbagai kemungkinan struktur response
            let results = result.results || result.data?.results || result;
            
            // Jika results bukan array, coba convert
            if (!Array.isArray(results)) {
                if (result.disease_name || result.disease || result.name) {
                    results = [result];
                } else {
                    results = [];
                }
            }
            
            if (!results || results.length === 0) {
                resultContent.innerHTML = `
                    <div class="text-center py-8">
                        <div class="text-6xl mb-4">❌</div>
                        <p class="text-gray-700 font-semibold text-lg mb-2">Tidak dapat menentukan diagnosa</p>
                        <p class="text-gray-500 text-sm">Tidak ada aturan yang cocok dengan gejala yang Anda pilih</p>
                        <div class="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg text-left">
                            <p class="text-sm text-gray-700"><strong> Kemungkinan penyebab:</strong></p>
                            <ul class="text-sm text-gray-600 mt-2 space-y-1 list-disc list-inside">
                                <li>Belum ada aturan (rules) yang menghubungkan gejala ini dengan penyakit</li>
                                <li>Gejala yang dipilih tidak cukup untuk menentukan diagnosa</li>
                                <li>Sistem pakar masih dalam tahap pengembangan</li>
                            </ul>
                            <p class="text-sm text-gray-600 mt-3">
                                <strong>Saran:</strong> Coba pilih gejala lain atau hubungi pakar untuk menambahkan aturan.
                            </p>
                        </div>
                    </div>
                `;
                return;
            }

            const topResult = results[0];
            
            // Dapatkan nilai CF dengan berbagai kemungkinan property name
            const getCF = (item) => {
                return item.cf_value || item.certainty_percentage || item.cf_result || item.cf || item.certainty_factor || item.confidence || 0;
            };
            
            // Dapatkan nama penyakit dengan berbagai kemungkinan property name
            const getDiseaseName = (item) => {
                return item.disease_name || item.disease?.name || item.name || 'Unknown';
            };
            
            // Dapatkan kategori
            const getCategory = (item) => {
                return item.category || item.disease?.category || '';
            };
            
            const topCF = getCF(topResult);
            const topName = getDiseaseName(topResult);
            const topCategory = getCategory(topResult);
            
            // Jika CF = 0, tampilkan peringatan
            if (topCF === 0 || topCF < 0.01) {
                resultContent.innerHTML = `
                    <div class="text-center py-8">
                        <div class="text-6xl mb-4"></div>
                        <p class="text-gray-700 font-semibold text-lg mb-2">Tingkat Kepastian Sangat Rendah</p>
                        <p class="text-gray-500 text-sm mb-4">Hasil diagnosa: <strong>${topName}</strong></p>
                        <div class="bg-red-50 border border-red-200 rounded-lg p-4 text-left">
                            <p class="text-sm text-gray-700"><strong> Peringatan:</strong></p>
                            <p class="text-sm text-gray-600 mt-2">
                                Sistem mendeteksi kemungkinan penyakit <strong>${topName}</strong>, 
                                namun dengan tingkat kepastian <strong>0%</strong>.
                            </p>
                            <p class="text-sm text-gray-600 mt-3"><strong>Kemungkinan penyebab:</strong></p>
                            <ul class="text-sm text-gray-600 mt-2 space-y-1 list-disc list-inside">
                                <li>Nilai MB dan MD dalam aturan mungkin tidak sesuai</li>
                                <li>Tingkat keyakinan yang dipilih terlalu rendah</li>
                                <li>Kombinasi gejala tidak memberikan nilai CF yang signifikan</li>
                            </ul>
                            <p class="text-sm text-gray-600 mt-3">
                                <strong>Saran:</strong> Periksa kembali aturan (rules) dan nilai MB/MD, 
                                atau coba pilih tingkat keyakinan yang lebih tinggi untuk gejala yang Anda alami.
                            </p>
                        </div>
                        <button onclick="navigateTo('consultation', ${state.currentSystem.id})"
                                class="mt-4 px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                             Coba Lagi
                        </button>
                    </div>
                `;
                return;
            }
            
            resultContent.innerHTML = `
                <div class="bg-gradient-to-r from-purple-100 to-blue-100 rounded-lg p-6 mb-6">
                    <h3 class="text-2xl font-bold text-gray-800 mb-2">
                        ${topName}
                    </h3>
                    ${topCategory ? `<p class="text-sm text-gray-600 mb-3">${topCategory}</p>` : ''}
                    <div class="flex items-center gap-4">
                        <div class="text-4xl font-bold text-purple-600">
                            ${(topCF * 100).toFixed(1)}%
                        </div>
                        <div>
                            <p class="text-sm text-gray-600">Tingkat Kepastian</p>
                            <p class="text-xs text-gray-500">CF: ${topCF.toFixed(4)}</p>
                        </div>
                    </div>
                </div>

                ${results.length > 1 ? `
                    <h4 class="font-bold text-gray-700 mb-3">Kemungkinan Lainnya:</h4>
                    <div class="space-y-3">
                        ${results.slice(1).map(r => {
                            const cf = getCF(r);
                            const name = getDiseaseName(r);
                            const category = getCategory(r);
                            
                            return `
                                <div class="bg-gray-50 rounded-lg p-4 flex justify-between items-center">
                                    <div>
                                        <h5 class="font-semibold text-gray-800">${name}</h5>
                                        ${category ? `<p class="text-sm text-gray-600">${category}</p>` : ''}
                                    </div>
                                    <div class="text-right">
                                        <div class="text-xl font-bold text-gray-700">
                                            ${(cf * 100).toFixed(1)}%
                                        </div>
                                        <p class="text-xs text-gray-500">CF: ${cf.toFixed(4)}</p>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                ` : ''}

                <div class="mt-6 pt-6 border-t space-y-3">
                    <button onclick="navigateTo('userConsultations')"
                            class="w-full px-4 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600">

                    <button onclick="navigateTo('consultation', ${state.currentSystem.id})"
                            class="w-full px-4 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                        Konsultasi Ulang
                    </button>
                </div>
            `;

            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

                                           class="w-24 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-600">
                                </div>
                                `
                            }
                        </div>
                        <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm">
                            <p class="text-gray-700"><strong>Info:</strong> Skala keyakinan digunakan oleh user saat konsultasi.</p>
                            <p class="text-gray-600 mt-1">Nilai harus antara 0 dan 1.</p>
                        </div>
                        <div class="flex justify-end gap-2 pt-4">
                            <button type="button" onclick="this.closest('.modal').remove()" 
                                    class="px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
                                Batal
                            </button>
                            <button type="submit" 
                                    class="px-6 py-2 gradient-bg text-white rounded-lg hover:opacity-90">
                                Simpan
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);
        }

        async function handleSaveScales(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const scales = [];
            
            let idx = 0;
            while (formData.has(`label_${idx}`)) {
                scales.push({
                    label: formData.get(`label_${idx}`),
                    value: parseFloat(formData.get(`value_${idx}`))
                });
                idx++;
            }

            try {
                await api.bulkUpsertConfidenceScales(state.currentSystem.id, scales);
                e.target.closest('.modal').remove();
                showNotification('Skala keyakinan berhasil disimpan!', 'success');
                await loadConfidenceScales();
            } catch (error) {
                console.error('Save scales error:', error);
            }
        }

        // Navigation
        async function navigateTo(page, id = null) {
            state.currentPage = page;
            
            if (page === 'pakarDashboard') {
                render();
                await loadExpertSystems();
            } else if (page === 'userDashboard') {
                render();
                await loadExpertSystems();
            } else if (page === 'systemDetail') {
                await loadSystemDetails(id);
            } else if (page === 'consultation') {
                await loadConsultationPage(id);
            } else if (page === 'userConsultations') {
                render();
                await loadConsultations();
            } else {
                render();
            }
        }

        // Render
        function render() {
            const app = document.getElementById('app');
            
            if (state.currentPage === 'login') {
                app.innerHTML = pages.login();
            } else if (state.currentPage === 'pakarDashboard') {
                app.innerHTML = pages.pakarDashboard();
            } else if (state.currentPage === 'userDashboard') {
                app.innerHTML = pages.userDashboard();
            } else if (state.currentPage === 'systemDetail') {
                app.innerHTML = pages.systemDetail(state.currentSystem);
            } else if (state.currentPage === 'consultation') {
                app.innerHTML = pages.consultation(state.currentSystem);
            } else if (state.currentPage === 'userConsultations') {
                app.innerHTML = pages.consultations();
            }
        }

        // Initialize
        async function init() {
            if (state.token) {
                try {
                    await api.getMe();
                    if (state.user.role === 'pakar') {
                        navigateTo('pakarDashboard');
                    } else {
                        navigateTo('userDashboard');
                    }
                } catch (error) {
                    console.error('Init error:', error);
                    navigateTo('login');
                }
            } else {
                navigateTo('login');
            }
        }

        // Start app
        init();
    </script>
</body>
</html>
